name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build frontend
        working-directory: frontend
        run: go build

      - name: Build backend
        working-directory: backend
        run: go build

      - name: Test frontend
        working-directory: frontend
        run: go test