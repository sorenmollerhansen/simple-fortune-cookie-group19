name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build frontend
        working-directory: frontend
        run: go build

      - name: Build backend
        working-directory: backend
        run: go build

      - name: Test frontend
        working-directory: frontend
        run: go test

  push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/sorenmollerhansen/sfc-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/sorenmollerhansen/sfc-${{ matrix.app }}:latest
  
  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write kubeconfig to disk
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy to Kubernetes
        run: kubectl --kubeconfig kubeconfig -n student-17 apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl --kubeconfig kubeconfig -n student-17 rollout status deploy/backend
          kubectl --kubeconfig kubeconfig -n student-17 rollout status deploy/frontend

  test-kubeconfig:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
      - run: kubectl --kubeconfig kubeconfig -n student-17 get pods            